map $http_upgrade $churn_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=churn_requisicoes:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=churn_estaticos:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=churn_por_ip:10m;
limit_conn_zone $server_name zone=churn_total:1m;

server {
    listen 80 default_server;
    server_name __IP_PUBLICO__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://__IP_PUBLICO__$request_uri; }
}

server {
    # O Nginx 1.24 do Ubuntu 24.04 habilita HTTP/2 no listen.
    listen 443 ssl http2 default_server;
    server_name __IP_PUBLICO__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/churn-publico/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/churn-publico/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:churn_tls:5m;
    ssl_session_tickets off;
    if ($host != __IP_PUBLICO__) { return 444; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    location ~ ^/(docs|redoc|openapi\.json|modelo|prever|saude|pronto|health)(/|$) {
        return 404;
    }
    location ~ (^|/)\. { return 404; }
    # O Streamlit carrega varios modulos em paralelo na primeira abertura.
    location ^~ /static/ {
        limit_req zone=churn_estaticos burst=300 nodelay;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host __IP_PUBLICO__;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
    }
    location / {
        limit_req zone=churn_requisicoes burst=50 nodelay;
        limit_conn churn_por_ip 20;
        limit_conn churn_total 50;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host __IP_PUBLICO__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $churn_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
